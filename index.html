<body>
<header>

    </div>
  </div>

    <button class="tab" data-view="survey">回答する</button>

    <button class="tab adminOnly hidden" data-view="stores">店舗管理</button>
  </nav>

    <select id="roleSelect">
      <option value="admin">経営層(全店舗)</option>

    </select>
    <select id="managerStore" class="hidden"></select>
  </div>
</header>

<main id="main"></main>
<div id="modalHolder"></div>

<footer>
  完全匿名 · 個人が特定される情報は記録されません · 人事評価には使用しません
</footer>

<script>
// 店舗一覧。追加・改名・削除はストレージに永続化。
const DEFAULT_STORES = ["ケアの木","ほしの木","くりの木","お茶の木","はれの木","にじの木","ゆずの木","サン薬局"];
let STORES;
try {
  const saved = JSON.parse(localStorage.getItem("ps_stores_v1") || "null");
  STORES = Array.isArray(saved) && saved.length>0 ? saved : DEFAULT_STORES.slice();
} catch(e){ STORES = DEFAULT_STORES.slice(); }
// 店舗一覧の保存: リモート有効時はApps Scriptへ、無効時はlocalStorageへ
async function saveStores(){
  if(typeof USE_REMOTE !== "undefined" && USE_REMOTE){
    try {

function seedSampleData(){
  // safe=安全性の地力(1-7), std=目標水準の地力(1-7), trend=四半期増減, n=各期人数
  const profiles = {
    "ケアの木":{safe:6.0, std:5.8, trend:0.15,  n:9},   // 挑戦的(高×高)
    "ほしの木":{safe:5.6, std:5.4, trend:0.10,  n:7},   // 挑戦的寄り
    "くりの木":{safe:5.5, std:3.4, trend:0.05,  n:8},   // ぬるい(高×低)
    "お茶の木":{safe:3.4, std:5.6, trend:-0.10, n:6},   // きつい(低×高)
    "はれの木":{safe:3.0, std:3.2, trend:0.20,  n:7},   // 事なかれ主義(低×低)から改善中
    "にじの木":{safe:4.2, std:4.4, trend:0.0,   n:5},   // 境界・横ばい
    "ゆずの木":{safe:5.8, std:5.2, trend:0.08,  n:10},  // 挑戦的
    "サン薬局":{safe:4.8, std:4.0, trend:0.10,  n:3},   // 小規模
  };
  function randn(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function clamp(x){ return Math.max(1, Math.min(SMAX, Math.round(x))); }
  const out = [];
  // サンプルは現在月から未来方向に4ヶ月分(古→新)
  const samplePeriods = (() => {
    const cur = currentPeriod();
    const idx = PERIODS.indexOf(cur);
    // PERIODS は降順なので [idx-3, idx] が現在月とその後3ヶ月分(降順)
    const to = Math.max(0, idx - 3);
    return PERIODS.slice(to, idx+1).reverse(); // 昇順(古→新)
  })();
  STORES.forEach(store=>{
    const p = profiles[store];
    samplePeriods.forEach((period, pi)=>{
      const safeCenter = p.safe + p.trend*pi;
      const stdCenter  = p.std;  // 目標水準は店舗の地力としてほぼ固定
      for(let i=0;i<p.n;i++){
        const personBias = randn()*0.5;
        const answers = {};
        QUESTIONS.forEach(q=>{
          const center = q.axis==="safety" ? safeCenter : stdCenter;
          const feel = clamp(center + personBias + randn()*0.7);
          answers[q.id] = q.reverse ? (SMAX+1 - feel) : feel;
        });
        const rec = { store, period, role: ROLES[Math.floor(Math.random()*ROLES.length)], answers, score:0, standard:0, ts: Date.now()-(samplePeriods.length-1-pi)*30*86400000+i*3600000 };
        rec.score = responseToScore(answers);
        rec.standard = responseToStandard(answers);
        out.push(rec);
      }
    });
  });
  return out;
}

// ===== 合意度評価 =====
// 与えられた数値配列(逆転処理済の1〜7点値)から SD と rWG(James-Demaree合意度) を返す
function agreementStats(values){
  if(!values || values.length<2) return null;
  const n = values.length;
  const mean = values.reduce((a,b)=>a+b,0)/n;
  const variance = values.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n; // 母分散
  const sd = Math.sqrt(variance);
  // 7段階尺度の理論最大分散 = (A^2 - 1) / 12,  A=7 → 4.0
  const maxVar = (SMAX*SMAX - 1) / 12;
  let rwg = 1 - (variance / maxVar);
  if(rwg < 0) rwg = 0; // 負値は0に丸める(James-Demareeの慣行)
  if(rwg > 1) rwg = 1;
  return { sd, rwg, mean, n };
}
function agreementLabel(rwg){
  if(rwg===null||rwg===undefined) return {text:"—", color:"#94a3b8", level:"none"};
  if(rwg >= 0.7) return {text:"合意◎", color:"#00B388", level:"high"};
  if(rwg >= 0.5) return {text:"中程度", color:"#d97706", level:"mid"};
  return {text:"意見割れ", color:"#dc2626", level:"low"};
}
// 1店舗の全回答(複数項目×複数人)から、各人の総合スコア(0-100)の合意度を計算
function storeAgreement(recs){
  if(!recs || recs.length<2) return null;
  // 各回答者の安全性スコア(0-100)をそのまま使ってSDを出すと、尺度がブレるので
  // 「各人の安全性軸の平均(1-7)」を使って合意度を計算する
  const safetyQs = QUESTIONS.filter(q=>q.axis==="safety");
  const perPerson = recs.map(r=>{
    let sum=0;
    for(const q of safetyQs){ const raw=r.answers[q.id]; sum += q.reverse ? (SMAX+1-raw) : raw; }
    return sum/safetyQs.length; // この人の1-7点での平均
  });
  return agreementStats(perPerson);
}
// 各設問ごとの回答分布(1〜7点それぞれの人数) -- 逆転処理済
function questionDistribution(recs, q){
  const dist = new Array(SMAX).fill(0);
  recs.forEach(r=>{
    const raw = r.answers[q.id];
    const v = q.reverse ? (SMAX+1-raw) : raw;
    if(v>=1 && v<=SMAX) dist[v-1]++;
  });
  return dist;
}
// 店舗の総合スコア分布(各人の1-7点平均をビン化)
function storeScoreDistribution(recs){
  if(!recs || recs.length===0) return new Array(SMAX).fill(0);
  const safetyQs = QUESTIONS.filter(q=>q.axis==="safety");
  const dist = new Array(SMAX).fill(0);
  recs.forEach(r=>{
    let sum=0;
    for(const q of safetyQs){ const raw=r.answers[q.id]; sum += q.reverse ? (SMAX+1-raw) : raw; }
    const avg = sum/safetyQs.length;
    const bin = Math.max(0, Math.min(SMAX-1, Math.round(avg)-1));
    dist[bin]++;
  });
  return dist;
}
function cellColor(v){
  if(v===null) return "#f8fafc";
  const t=(v-1)/(SMAX-1);
  const r=Math.round(239-t*(239-31)), g=Math.round(68+t*(157-68)), b=Math.round(68+t*(107-68));
  return `rgba(${r},${g},${b},0.16)`;
}

// 名前変更: 過去回答の店舗名も一括更新(ローカルモード時のみ過去回答更新)
async function renameStore(oldName, newName){
  newName = newName.trim();
  if(!newName || newName===oldName) return false;
  if(STORES.includes(newName)){ alert(`「${newName}」はすでに存在します`); return false; }
  const idx = STORES.indexOf(oldName);
  if(idx<0) return false;
  STORES[idx] = newName;
  await saveStores();
  if(!USE_REMOTE){
    // ローカルモードでは過去回答の店舗名も書き換え
    responses.forEach(r=>{ if(r.store===oldName) r.store = newName; });
    save();
  } else {
    // リモートモード: 既存の回答データの店舗名は自動更新されない
    // スプレッドシート上で手動で書き換える必要がある旨を通知
    alert(`店舗名を変更しました。\n\n⚠️ 過去回答の店舗名(${oldName})は自動更新されません。スプレッドシートで一括置換してください。`);
  }
  if(managerStore===oldName) managerStore = newName;
  if(quadStoreSel===oldName) quadStoreSel = newName;
  return true;
}
async function addStore(name){
  name = name.trim();
  if(!name) return false;
  if(STORES.includes(name)){ alert(`「${name}」はすでに存在します`); return false; }
  STORES.push(name);
  await saveStores();
  return true;
}
async function deleteStore(name){
  const respCount = responses.filter(r=>r.store===name).length;
  let msg = `店舗「${name}」を削除しますか？`;
  if(respCount>0){
    msg += `\n\n⚠️ この店舗には ${respCount}件の過去回答があります。\n削除しても回答データはスプレッドシートに残ります。\n回答データを消したい場合はスプレッドシートで直接削除してください。`;
  }
  if(!confirm(msg)) return false;
  // ローカルモードのみ回答データも消すオプション
  if(!USE_REMOTE && respCount>0){
    if(confirm(`過去の${respCount}件の回答データも一緒に削除しますか?\n\n[OK] = 回答データも完全削除(取り消し不可)\n[キャンセル] = 回答データは残す`)){
      responses = responses.filter(r=>r.store!==name);
      save();
    }
  }
  STORES = STORES.filter(s=>s!==name);
  await saveStores();
  if(managerStore===name) managerStore = STORES[0] || "";
  if(quadStoreSel===name) quadStoreSel = STORES[0] || "";
  return true;
}
async function moveStore(idx, delta){
  const j = idx + delta;
  if(j<0 || j>=STORES.length) return;
  [STORES[idx], STORES[j]] = [STORES[j], STORES[idx]];
  await saveStores();
}

function dashboardHtml(){
  const visibleStores = role==="manager" ? [managerStore] : STORES;
  const byKey = {};
  responses.forEach(r=>{ const k=r.store+"__"+r.period; (byKey[k]=byKey[k]||[]).push(r); });

  const storeScores = visibleStores.map(store=>{
    const recs = byKey[store+"__"+dashPeriod] || [];
    const n = recs.length;
    const prot = n < minN;
    const avg = n ? recs.reduce((a,r)=>a+r.score,0)/n : null;
    const std = n ? recs.reduce((a,r)=>a+(r.standard!==undefined?r.standard:responseToStandard(r.answers)),0)/n : null;
    const quad = (!prot && avg!==null && std!==null) ? quadrant(avg, std) : null;
    const perQ = QUESTIONS.map(q=>{
      if(!n) return null;
      const vals = recs.map(r=> q.reverse ? (SMAX+1)-r.answers[q.id] : r.answers[q.id]);
      return vals.reduce((a,b)=>a+b,0)/vals.length;
    });
    const agree = (!prot && n>=2) ? storeAgreement(recs) : null;
    const scoreDist = (!prot) ? storeScoreDistribution(recs) : null;
    return {store,n,prot,avg,std,quad,perQ,agree,scoreDist};
  });

  const head = `<div class="dashHead">

    const lineEndX = cx+dx;
    const lineEndY = cy+dy;
    const anchor = dx>0 ? "start" : "end";
    const textX = lineEndX + (dx>0 ? 8 : -8);
    qDots = `<g>
      <circle cx="${cx}" cy="${cy}" r="24" fill="#00B388" opacity="0.10" filter="url(#dotGlow)"/>
      <circle cx="${cx}" cy="${cy}" r="13" fill="#00B388" opacity="0.18"/>
      <circle cx="${cx}" cy="${cy}" r="7" fill="#00B388" stroke="#fff" stroke-width="2" filter="url(#dotShadow)"/>
      <line x1="${cx}" y1="${cy}" x2="${lineEndX}" y2="${lineEndY}" stroke="#0f172a" stroke-width="0.6"/>
      <text x="${textX}" y="${lineEndY-2}" font-size="14" fill="#0f172a" font-weight="700" text-anchor="${anchor}" letter-spacing="0.5">${focus.store}</text>
      <text x="${textX}" y="${lineEndY+14}" font-size="10" fill="#64748b" font-weight="500" text-anchor="${anchor}" letter-spacing="0.5" font-family="'Space Grotesk',Inter,sans-serif">SAFE ${focus.avg.toFixed(1)}  /  STD ${focus.std.toFixed(1)}</text>
    </g>`;
  }
  // 選択店舗の状態カード + 全体象限内訳(数のみ)
  const quadInfo = [
    {key:"wakuwaku",   name:"挑戦的",       desc:"目標高 × 安全性高"},
    {key:"nurui",      name:"ぬるい",       desc:"目標低 × 安全性高"},
    {key:"kitsui",     name:"きつい",       desc:"目標高 × 安全性低"},
    {key:"kotonakare", name:"事なかれ主義", desc:"目標低 × 安全性低"},
  ];
  const counts = {};
  quadInfo.forEach(q=>counts[q.key]=0);
  allPlotable.forEach(s=>counts[s.quad.key]++);

  const focusCard = focus ? `
    <div class="focusCard">
      <div class="focusLabel">選択中の店舗</div>
      <div class="focusName">${focus.store}</div>
      <div class="focusQuad" style="color:${focus.quad.color}">${focus.quad.name} <span class="focusQuadDesc">${focus.quad.desc}</span></div>
      <div class="focusMetrics">
        <div class="focusMetric"><div class="fmLabel">心理的安全性</div><div class="fmValue">${focus.avg.toFixed(1)}</div></div>
        <div class="focusMetric"><div class="fmLabel">目標水準</div><div class="fmValue">${focus.std.toFixed(1)}</div></div>
        <div class="focusMetric"><div class="fmLabel">回答数</div><div class="fmValue">${focus.n}</div></div>
      </div>
    </div>` : `<div class="focusCard"><div class="focusLabel">選択中の店舗</div><div class="focusName">${focusStore}</div><div style="color:#94a3b8;font-size:13px;margin-top:8px">この期のデータがありません(n≥${minN} が必要)</div></div>`;

  const distList = `<div class="distList">${quadInfo.map(q=>`<div class="distRow"><span class="distName">${q.name}</span><span class="distBar"><span class="distBarFill" style="width:${allPlotable.length?(counts[q.key]/allPlotable.length*100):0}%"></span></span><span class="distCount">${counts[q.key]}店</span></div>`).join("")}</div>`;

  // 店舗セレクタ(経営層のみ)
  const storeSelector = role==="admin" ? `<div class="quadStoreNav">
    ${STORES.map(s=>`<button class="storeChip${s===focusStore?' active':''}" data-quad-store="${s}">${s}</button>`).join("")}
  </div>` : "";

  const quadPanel = `<div class="panel quadPanel">
    <h3>4象限マップ <span class="panelSub">心理的安全性 × 目標水準 / ${formatPeriod(dashPeriod)}</span></h3>
    ${storeSelector}
    ${allPlotable.length===0 ? `<div class="empty">表示できる店舗がありません(n≥${minN} が必要)</div>` :
    `<div class="quadLayout">
      <div class="quadChartWrap"><svg viewBox="0 0 ${QW} ${QH}" style="width:100%;height:auto;display:block">${qDefs}${canvas}${qBg}${microGrid}${qAxes}${qLabels}${qAxisLabels}${qDots}</svg></div>
      <div class="quadSide">
        ${focusCard}
        <div class="distTitle">全体の分布(${allPlotable.length}店)</div>
        ${distList}
      </div>
    </div>`}
  </div>`;

  // ===== 経時変化グラフ =====
  // データのある実施月のみ表示(古い順)。60ヶ月全部を表示するとX軸が潰れるため。
  const usedPeriods = (() => {
    const set = new Set();
    responses.forEach(r => set.add(r.period));
    return Array.from(set).filter(p => PERIODS.includes(p)).sort(); // 昇順(古い→新しい)
  })();
  // 店舗ごとの各期スコア(minN未満はnull)
  const storeColors = ["#00B388","#2563eb","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d"];
  function storeSeries(store){
    return usedPeriods.map(p=>{
      const recs = byKey[store+"__"+p] || [];
      if(recs.length < minN || recs.length===0) return null;
      return recs.reduce((a,r)=>a+r.score,0)/recs.length;
    });
  }
  const seriesStores = role==="manager" ? [managerStore] : STORES;
  const seriesData = seriesStores.map((s,i)=>({ store:s, color: role==="manager" ? "#00B388" : storeColors[i%storeColors.length], vals: storeSeries(s) }));

  const W=760,H=280,padL=40,padR=20,padT=20,padB=40;
  const y = v => H-padB-(v/100)*(H-padT-padB);
  const xStep = (W-padL-padR)/Math.max(1, usedPeriods.length-1);
  const xAt = i => padL + i*xStep;
  const grid = [0,25,50,75,100].map(g=>`<line x1="${padL}" y1="${y(g)}" x2="${W-padR}" y2="${y(g)}" stroke="#e2e8f0"/><text x="${padL-8}" y="${y(g)+4}" font-size="11" fill="#94a3b8" text-anchor="end">${g}</text>`).join("");
  // X軸ラベルは点数が多い時は間引く(最大8個程度)
  const labelStep = Math.max(1, Math.ceil(usedPeriods.length/8));
  const xLabels = usedPeriods.map((p,i)=>{
    if(i % labelStep !== 0 && i !== usedPeriods.length-1) return "";
    return `<text x="${xAt(i)}" y="${H-padB+20}" font-size="10" fill="#64748b" text-anchor="middle">${formatPeriod(p)}</text>`;
  }).join("");

  let lines = "";
  seriesData.forEach(sd=>{
    let seg=[];
    const flush=()=>{ if(seg.length){ lines += `<path d="${seg.map((pt,k)=>(k===0?"M":"L")+pt.x+","+pt.y).join(" ")}" fill="none" stroke="${sd.color}" stroke-width="2.5"/>`; seg.forEach(pt=>{ lines += `<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="${sd.color}" stroke="#fff" stroke-width="1.5"><title>${sd.store} ${formatPeriod(pt.period)}: ${pt.v.toFixed(1)}</title></circle>`; }); } seg=[]; };
    sd.vals.forEach((v,i)=>{ if(v===null){ flush(); } else { seg.push({x:xAt(i), y:y(v), v, period:usedPeriods[i]}); } });
    flush();
    if(role==="manager"){ sd.vals.forEach((v,i)=>{ if(v!==null) lines += `<text x="${xAt(i)}" y="${y(v)-12}" font-size="12" fill="#0f2e22" text-anchor="middle" font-weight="600">${v.toFixed(0)}</text>`; }); }
  });

  const anyData = seriesData.some(sd=>sd.vals.some(v=>v!==null));
  const storeLegend = role==="admin" ? `<div class="storeLegend">${seriesData.map(sd=>`<span class="sLeg"><span class="sLegDot" style="background:${sd.color}"></span>${sd.store}</span>`).join("")}</div>` : "";
  const trendPanel = `<div class="panel"><h3>店舗別 経時変化 ${role==="manager"?"("+managerStore+")":"(全店舗)"}</h3>
    ${anyData ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xLabels}${lines}</svg>${storeLegend}`
    : `<div class="empty">表示できるデータがありません(各期 n≥${minN} が必要)</div>`}</div>`;

  const visibleHeat = storeScores.filter(s=>!s.prot);
  const qLegend = `<div class="qLegend">${QUESTIONS.map((q,i)=>`<div class="qLegendItem"><span class="qLegendNum">Q${i+1}</span><span class="qLegendCat">${q.cat}</span><span class="qLegendText">${q.text}${q.reverse?'<span class="revTag">逆転</span>':''}</span></div>`).join("")}</div>`;
  const heat = visibleHeat.length===0 ? `<div class="empty">表示できる店舗がありません(n≥${minN} が必要)</div>`
    : `<div style="overflow-x:auto"><table>
        <thead><tr><th class="store">店舗</th>${QUESTIONS.map((q,i)=>`<th title="${q.text}">Q${i+1}</th>`).join("")}</tr></thead>
        <tbody>${visibleHeat.map(s=>`<tr><td class="store">${s.store}</td>${s.perQ.map((v,i)=>`<td class="cell" style="background:${cellColor(v)}" title="Q${i+1}: ${QUESTIONS[i].text}${v!==null?' ／ 平均'+v.toFixed(1):''}">${v!==null?v.toFixed(1):"—"}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
      <div class="legend"><span>低</span><div class="legendBar"></div><span>高</span><span style="margin-left:auto;color:#94a3b8">各項目 1〜7点(逆転項目は反転済) ／ セルにカーソルを乗せると質問文を表示</span></div>
      ${qLegend}</div>`;
  const heatPanel = `<div class="panel"><h3>項目別スコア(7点満点・逆転処理済) — ${formatPeriod(dashPeriod)}</h3>${heat}</div>`;

  return head + cards + quadPanel + trendPanel + heatPanel;
}

// ===== 店舗詳細モーダル =====
function openStoreDetail(store){
  const byKey = {};
  responses.forEach(r=>{ const k=r.store+"__"+r.period; (byKey[k]=byKey[k]||[]).push(r); });

  // この店舗で実際に回答があった月のみ表示
  const storePeriods = (() => {
    const set = new Set();
    responses.filter(r=>r.store===store).forEach(r=>set.add(r.period));
    return Array.from(set).filter(p => PERIODS.includes(p)).sort();
  })();

  // 各期のサマリ(minN未満の期は保護して非表示)
  const rows = storePeriods.map(p=>{
    const recs = byKey[store+"__"+p] || [];
    const n = recs.length;
    const prot = n < minN || n === 0;
    const avg = (!prot) ? recs.reduce((a,r)=>a+r.score,0)/n : null;
    const perQ = QUESTIONS.map(q=>{
      if(prot) return null;
      const vals = recs.map(r=> q.reverse ? (SMAX+1)-r.answers[q.id] : r.answers[q.id]);
      return vals.reduce((a,b)=>a+b,0)/vals.length;
    });
    return {period:p, n, prot, avg, perQ};
  });

  // 折れ線(この店だけ)
  const W=560,H=200,padL=36,padR=16,padT=16,padB=34;
  const y=v=>H-padB-(v/100)*(H-padT-padB);
  const xStep=(W-padL-padR)/Math.max(1,storePeriods.length-1);
  const xAt=i=>padL+i*xStep;
  const grid=[0,50,100].map(g=>`<line x1="${padL}" y1="${y(g)}" x2="${W-padR}" y2="${y(g)}" stroke="#e2e8f0"/><text x="${padL-6}" y="${y(g)+4}" font-size="10" fill="#94a3b8" text-anchor="end">${g}</text>`).join("");
  const pts=rows.map((r,i)=>r.avg!==null?{x:xAt(i),y:y(r.avg),v:r.avg,p:r.period}:null);
  const valid=pts.filter(p=>p);
  const path=valid.map((p,i)=>(i===0?"M":"L")+p.x+","+p.y).join(" ");
  const xLabelStep = Math.max(1, Math.ceil(storePeriods.length/6));
  const dots=pts.map((p,i)=>{
    const showLabel = i % xLabelStep === 0 || i === storePeriods.length-1;
    return `${p?`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#00B388" stroke="#fff" stroke-width="1.5"/><text x="${p.x}" y="${p.y-10}" font-size="11" fill="#0f2e22" text-anchor="middle" font-weight="600">${p.v.toFixed(0)}</text>`:""}${showLabel?`<text x="${xAt(i)}" y="${H-padB+18}" font-size="9" fill="#64748b" text-anchor="middle">${formatPeriod(storePeriods[i])}</text>`:""}`;
  }).join("");
  const chart = valid.length ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${path}" fill="none" stroke="#00B388" stroke-width="2.5"/>${dots}</svg>` : `<div class="empty">表示できるデータがありません</div>`;

  // 期×総合スコアの表(合意度カラムも追加)
  const summaryTable = `<table class="mTable"><thead><tr><th class="store">期</th><th>回答数</th><th>総合スコア</th><th>状態</th><th>合意度</th></tr></thead>
    <tbody>${rows.map(r=>{
      const ag = (!r.prot && r.n>=2) ? storeAgreement(byKey[store+"__"+r.period]||[]) : null;
      const al = ag ? agreementLabel(ag.rwg) : null;
      return `<tr><td class="store">${formatPeriod(r.period)}</td><td class="cell">${r.prot?'🔒':r.n}</td>
      <td class="cell" style="font-weight:700;color:${r.avg!==null?scoreColor(r.avg):'#94a3b8'}">${r.avg!==null?r.avg.toFixed(1):'—'}</td>
      <td class="cell">${r.avg!==null?scoreLabel(r.avg):'—'}</td>
      <td class="cell" style="color:${al?al.color:'#94a3b8'};font-weight:600">${al?al.text:'—'}${ag?` <span style="color:#94a3b8;font-weight:500">(SD ${ag.sd.toFixed(2)})</span>`:""}</td></tr>`;
    }).join("")}</tbody></table>`;

  // ===== 最新期の合意度詳細 =====
  const latestRecs = byKey[store+"__"+dashPeriod] || [];
  const latestAgree = latestRecs.length>=2 ? storeAgreement(latestRecs) : null;
  const latestAL = latestAgree ? agreementLabel(latestAgree.rwg) : null;
  let agreementSection = "";
  if(latestAgree && latestRecs.length>=minN){
    const scoreDist = storeScoreDistribution(latestRecs);
    const maxBin = Math.max(...scoreDist, 1);
    const totalN = latestRecs.length;
    const HISTW = 480, HISTH = 140, hpad=30;
    const binW = (HISTW - hpad*2) / SMAX;
    const histBars = scoreDist.map((v,i)=>{
      const h = v/maxBin * (HISTH - hpad - 20);
      const x = hpad + i*binW;
      const y = HISTH - hpad - h;
      return `<g>
        <rect x="${x+4}" y="${y}" width="${binW-8}" height="${h}" fill="#00B388" opacity="${v===0?0.15:0.85}" rx="2"/>
        ${v>0?`<text x="${x+binW/2}" y="${y-4}" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="600">${v}</text>`:""}
        <text x="${x+binW/2}" y="${HISTH-hpad+14}" font-size="10" fill="#64748b" text-anchor="middle">${i+1}</text>`;
    }).join("");
    const axisLine = `<line x1="${hpad}" y1="${HISTH-hpad}" x2="${HISTW-hpad}" y2="${HISTH-hpad}" stroke="#cbd5e1" stroke-width="1"/>`;
    const histSvg = `<svg viewBox="0 0 ${HISTW} ${HISTH}" style="width:100%;height:auto;max-width:480px">${axisLine}${histBars}<text x="${HISTW/2}" y="${HISTH-4}" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">SCORE  (1〜7)</text></svg>`;
    agreementSection = `
      <h3 style="margin-top:24px">回答のばらつき(${formatPeriod(dashPeriod)})</h3>
      <div class="agreeDetail">
        <div class="agreeStats">
          <div class="agStat">
            <div class="agLabel">合意度 (rWG)</div>
            <div class="agValue" style="color:${latestAL.color}">${latestAgree.rwg.toFixed(2)}</div>
            <div class="agSub" style="color:${latestAL.color}">${latestAL.text}</div>
          </div>
          <div class="agStat">
            <div class="agLabel">標準偏差 (SD)</div>
            <div class="agValue">${latestAgree.sd.toFixed(2)}</div>
            <div class="agSub">${latestAgree.sd<1.0?"意見が揃っている":latestAgree.sd<1.5?"やや割れ":"意見が割れている"}</div>
          </div>
          <div class="agStat">
            <div class="agLabel">回答者数</div>
            <div class="agValue">${totalN}</div>
            <div class="agSub">名の声を集計</div>
          </div>
        </div>
        <div class="agHist">
          <div class="agHistTitle">回答者の総合スコア分布</div>
          ${histSvg}
          <div class="agHistNote">横軸=各回答者のスコア(1〜7点平均) / 縦軸=人数<br>両端に山があれば「店内で意見が割れている」状態を意味します。</div>
        </div>
      </div>`;
  }

  // 項目別スコアの期間推移(行=Q, 列=期)
  const perQTable = `<div style="overflow-x:auto"><table class="mTable">
    <thead><tr><th class="store">質問</th>${storePeriods.map(p=>`<th>${formatPeriod(p)}</th>`).join("")}</tr></thead>
    <tbody>${QUESTIONS.map((q,qi)=>`<tr><td class="store" style="font-weight:400;font-size:12px">Q${qi+1} ${q.text}${q.reverse?'<span class="revTag">逆転</span>':''}</td>
      ${rows.map(r=>{const v=r.perQ[qi];return `<td class="cell" style="background:${cellColor(v)}">${v!==null?v.toFixed(1):'—'}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;

  const html = `<div class="modalOverlay" id="modalOverlay">
    <div class="modal">
      <div class="modalHead">
        <h2 style="margin:0">${store} の記録</h2>
        <button class="modalClose" id="modalClose">✕</button>
      </div>
      <div class="modalBody">
        <h3>総合スコアの推移</h3>
        ${chart}
        ${summaryTable}
        ${agreementSection}
        <h3 style="margin-top:24px">項目別スコアの推移(7点満点・逆転処理済)</h3>
        ${perQTable}
        <div class="legend" style="margin-top:12px"><span>低</span><div class="legendBar"></div><span>高</span></div>
      </div>
    </div>
  </div>`;
  const holder = document.getElementById("modalHolder");
  holder.innerHTML = html;
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
}
function closeModal(){ document.getElementById("modalHolder").innerHTML=""; }

function bindEvents(){
  document.querySelectorAll("[data-go]").forEach(b=> b.addEventListener("click",()=>{ view=b.dataset.go; render(); }));
  // ログイン
  const loginBtn = document.getElementById("loginBtn");
  const pwInput = document.getElementById("pwInput");
  function tryLogin(){
    const pw = pwInput.value;
    if(pw === ADMIN_PASSWORD){ isAdminMode = true; render(); }
    else { const err=document.getElementById("loginErr"); err.textContent="パスワードが違います"; pwInput.value=""; pwInput.focus(); }
  }
  if(loginBtn) loginBtn.addEventListener("click", tryLogin);
  if(pwInput) pwInput.addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
  // ログアウト
  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", ()=>{ isAdminMode=false; view="home"; render(); });
  document.querySelectorAll(".scoreCard.clickable").forEach(c=> c.addEventListener("click",()=> openStoreDetail(c.dataset.store)));
  const seed=document.getElementById("seedBtn");
  if(seed) seed.addEventListener("click",()=>{ responses = seedSampleData(); save(); role="admin"; view="dashboard"; render(); });
  const reset=document.getElementById("resetBtn");
  if(reset) reset.addEventListener("click",()=>{ if(confirm("すべての回答データを消去します。よろしいですか？")){ responses=[]; save(); render(); } });
  if(view==="survey" && !surveyState.done){
    const st=document.getElementById("svStore"); if(st) st.addEventListener("change",e=>{ surveyState.store=e.target.value; render(); });
    const rl=document.getElementById("svRole"); if(rl) rl.addEventListener("change",e=>{ surveyState.roleSel=e.target.value; });
    const pd=document.getElementById("svPeriod"); if(pd) pd.addEventListener("change",e=>{ surveyState.period=e.target.value; });
    document.querySelectorAll(".scaleBtn").forEach(b=> b.addEventListener("click",()=>{ surveyState.answers[b.dataset.q]=parseInt(b.dataset.v); render(); }));
    const sb=document.getElementById("submitBtn");
    if(sb) sb.addEventListener("click", async ()=>{
      sb.disabled = true; sb.textContent = "送信中…";
      const rec = { store:surveyState.store, period:surveyState.period, role:surveyState.roleSel||"未回答", answers:{...surveyState.answers}, score:responseToScore(surveyState.answers), standard:responseToStandard(surveyState.answers), ts:Date.now() };
      const ok = await submitResponse(rec);
      if(ok){ surveyState.done=true; render(); }
      else { sb.disabled = false; sb.textContent = "回答を送信"; }
    });
  }
  if(view==="survey" && surveyState.done){
    const ag=document.getElementById("again");
    if(ag) ag.addEventListener("click",()=>{ surveyState={store:"",roleSel:"",period:currentPeriod(),answers:{},done:false}; render(); });
  }
  if(view==="dashboard"){
    const dp=document.getElementById("dashPeriod"); if(dp) dp.addEventListener("change",e=>{ dashPeriod=e.target.value; render(); });
    const mn=document.getElementById("minNSelect"); if(mn) mn.addEventListener("change",e=>{ minN=parseInt(e.target.value); render(); });
    document.querySelectorAll("[data-quad-store]").forEach(b=> b.addEventListener("click",()=>{ quadStoreSel=b.dataset.quadStore; render(); }));
  }
  if(view==="stores"){
    const addBtn = document.getElementById("addStoreBtn");
    const newInput = document.getElementById("newStoreInput");
    async function doAdd(){
      if(await addStore(newInput.value)){ newInput.value=""; render(); }
    }
    if(addBtn) addBtn.addEventListener("click", doAdd);
    if(newInput) newInput.addEventListener("keydown", e=>{ if(e.key==="Enter") doAdd(); });
    document.querySelectorAll(".storeNameInput").forEach(inp=>{
      const commit = async ()=>{
        const oldName = inp.dataset.orig;
        const newName = inp.value;
        if(newName.trim() === oldName){ inp.value = oldName; return; }
        if(await renameStore(oldName, newName)) render();
        else { inp.value = oldName; }
      };
      inp.addEventListener("blur", commit);
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ inp.blur(); } if(e.key==="Escape"){ inp.value=inp.dataset.orig; inp.blur(); } });
    });
    document.querySelectorAll(".upBtn").forEach(b=> b.addEventListener("click", async ()=>{ await moveStore(parseInt(b.dataset.idx), -1); render(); }));
    document.querySelectorAll(".downBtn").forEach(b=> b.addEventListener("click", async ()=>{ await moveStore(parseInt(b.dataset.idx), 1); render(); }));
    document.querySelectorAll(".dangerBtn").forEach(b=> b.addEventListener("click", async ()=>{ if(await deleteStore(b.dataset.store)) render(); }));
  }
}
// 起動: まず画面表示してから、非同期でリモートデータ取得
render();
loadResponses();
